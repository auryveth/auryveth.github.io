<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURYVETH Motion Diagnostic</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#01070d;color:#dffcff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center}.panel{width:min(92vw,820px);padding:32px;border:1px solid #184455;border-radius:24px;background:#03111d}.orb{position:relative;width:240px;height:240px;margin:24px auto;border-radius:50%;border:1px solid #247886;background:radial-gradient(circle,#62f3f8 0 3%,#0b7188 18%,transparent 42%)}.orb::before{content:"";position:absolute;inset:18%;border:1px solid #55dfe6;border-radius:50%;animation:spin 2.4s linear infinite}.orb::after{content:"";position:absolute;left:50%;top:50%;width:82%;height:27%;border:1px solid #55dfe6;border-radius:50%;transform:translate(-50%,-50%) rotate(28deg);animation:pulse 1.7s ease-in-out infinite}.dot{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:#bfffff;box-shadow:0 0 18px #62f3f8;animation:orbit 2.2s linear infinite}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{padding:12px 14px;border:1px solid #12384a;border-radius:12px;color:#89a7b7}.item strong{display:block;color:#e7fbfd;margin-top:4px}.ok{color:#71f3ba}.warn{color:#ffd47b}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{transform:translate(-50%,-50%) rotate(28deg) scale(.86);opacity:.4}50%{transform:translate(-50%,-50%) rotate(28deg) scale(1.15);opacity:1}}@keyframes orbit{from{transform:rotate(0) translateX(92px)}to{transform:rotate(360deg) translateX(92px)}}button{border:1px solid #2d8896;background:#082131;color:#dffcff;padding:10px 14px;border-radius:999px;cursor:pointer}small{color:#6f8b9a}</style>
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<main class="panel"><h1>AURYVETH motion diagnostic</h1><p>This page is for development only. The orb should rotate, pulse, and orbit continuously.</p><div class="orb"><span class="dot"></span></div><div class="grid"><div class="item">JavaScript<strong id="js">checking</strong></div><div class="item">Canvas 2D<strong id="canvas">checking</strong></div><div class="item">System reduced-motion<strong id="reduced">checking</strong></div><div class="item">requestAnimationFrame<strong id="raf">checking</strong></div></div><p><button id="clear">Clear saved motion preference</button></p><small>Saved AURYVETH motion preference: <span id="saved">checking</span></small><canvas id="test" width="240" height="40" style="display:block;width:100%;height:40px;margin-top:18px"></canvas></main>
<script>
document.getElementById('js').textContent='working';document.getElementById('js').className='ok';
const c=document.getElementById('test'),ctx=c.getContext('2d');document.getElementById('canvas').textContent=ctx?'supported':'unavailable';document.getElementById('canvas').className=ctx?'ok':'warn';
const mq=matchMedia('(prefers-reduced-motion: reduce)');document.getElementById('reduced').textContent=mq.matches?'YES — site defaults to reduced':'no';document.getElementById('reduced').className=mq.matches?'warn':'ok';
let frames=0,last=performance.now();function tick(now){frames++;if(ctx){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#55eef4';ctx.fillRect((now*.08)%c.width,16,10,10)}if(now-last>1000){document.getElementById('raf').textContent=frames+' fps';document.getElementById('raf').className=frames>10?'ok':'warn';frames=0;last=now}requestAnimationFrame(tick)}requestAnimationFrame(tick);
function saved(){let v=null;try{v=localStorage.getItem('auryveth-motion')}catch{}document.getElementById('saved').textContent=v||'none (follow system)'}saved();document.getElementById('clear').onclick=()=>{try{localStorage.removeItem('auryveth-motion')}catch{}saved()};
</script></body></html>
