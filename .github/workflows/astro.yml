name: Publish AURYVETH website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check pymupdf==1.26.4

      - name: Validate source
        run: npm run check:source

      - name: Build Astro site
        run: npm run build

      - name: Validate output
        run: node scripts/validate-built.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout for discovery notification
        uses: actions/checkout@v4

      - name: Notify IndexNow of published URLs
        continue-on-error: true
        env:
          SITE_ORIGIN: https://auryveth.github.io
          INDEXNOW_KEY: c3e3148c2c59bda0c83a19400c31c7dc
        run: node scripts/notify-indexnow.mjs